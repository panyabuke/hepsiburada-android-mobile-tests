[pytest]
testpaths = tests
pythonpath = .
# -x: bir test başarısız olursa çalıştırma durur; hata düzeltilmeden sonraki teste geçilmez.
# Klasörlerin çalışma sırası conftest.py > KLASOR_SIRASI'nda tanımlıdır.
addopts = -v -x --html=reports/rapor.html --self-contained-html
filterwarnings =
    ignore:urllib3 v2 only supports OpenSSL
markers =
    smoke: Hızlı sağlık kontrolü
    regression: Temel fonksiyonların regresyon seti
    blackbox: Girdi/çıktıya dayalı kara kutu testleri
    whitebox: İç yapıya dayalı beyaz kutu testleri
    integration: Ekranlar/modüller arası entegrasyon testleri
    e2e: Uçtan uca kullanıcı alışveriş yolculuğu
    pozitif: Beklenen (mutlu yol) senaryo
    negatif: Hatalı/olumsuz senaryo
    hesap: Gerçek test hesabı gerektirir (HB_EMAIL / HB_PASSWORD)
    bilinen_hata: Uygulamada bulunan ve hatalar/ klasöründe raporlanan hatayı yeniden üreten test
    standart: Ürün kategorisi - renk/beden seçimi olmayan, indirimsiz ürün
    renk_secimli: Ürün kategorisi - yalnızca renk seçimi olan ürün
    beden_secimli: Ürün kategorisi - yalnızca beden/numara seçimi olan ürün
    coklu_secimli: Ürün kategorisi - renk ve beden gibi birden fazla seçimi olan ürün
    indirimli: Ürün kategorisi - eski fiyatı üstü çizili, indirim yüzdeli ürün
    stokta_olmayan: Ürün kategorisi - en az bir seçeneği 'Stokta yok' olan ürün
